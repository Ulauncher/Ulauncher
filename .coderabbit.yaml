language: en-US
issue_enrichment:
  auto_enrich:
    enabled: false
reviews:
  profile: chill

  # Suppress redundant posts and collapse the "walkthrough" post
  review_status: false          # removes the "Actions performed" status comment
  in_progress_fortune: false    # removes the in-progress "Currently processing…" comment
  collapse_walkthrough: true

  # Don't edit the PR top post
  high_level_summary_in_walkthrough: true

  # Remove mostly redundant/noisy sections
  sequence_diagrams: false
  suggested_labels: false
  changed_files_summary: false
  poem: false

  # disable coderabbit suggesting tasks
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # disable docstring coverage checks
  pre_merge_checks:
    docstrings:
      mode: off

  # Focus reviews on changed code only
  path_instructions:
    - path: "ulauncher/**"
      instructions: |
        ALWAYS verify and NEVER assume input is untrusted.
        Ulauncher controls both sides of the extension IPC and passes the environment to the
        extensions too, so we MUST NOT validate these as if it's untrusted input.
