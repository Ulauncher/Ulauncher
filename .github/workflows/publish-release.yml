name: Publish release

on:
  release:
    types: [published]
  # Uploads an existing release to the supported Ubuntu releases that don't have it yet.
  # Use from https://github.com/Ulauncher/Ulauncher/actions/workflows/publish-release.yml
  # Run it from a release tag, or from a branch to use the latest tag on that branch.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container: ulauncher/build-image:6.7
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe needs the history and tags
          fetch-depth: 0
      - name: Check out the latest tag
        if: github.ref_type == 'branch'
        run: git checkout "$(git describe --tags --abbrev=0)"
      - name: Publish to Launchpad
        env:
          LAUNCHPAD_SSH_TAR: ${{ secrets.LAUNCHPAD_SSH_TAR }}
          LAUNCHPAD_PUB_KEY: ${{ secrets.LAUNCHPAD_PUB_KEY }}
          LAUNCHPAD_SECRET_KEY: ${{ secrets.LAUNCHPAD_SECRET_KEY }}
          GPGKEY: ${{ secrets.DEB_GPGKEY }}
          PPA: agornostal/ulauncher
        shell: bash
        run: |
          echo "Ref type: $GITHUB_REF_TYPE"
          VERSION=$(make version)
          echo "Version: $VERSION"
          # If release name contains prerelease-separator "-", use ulauncher-dev PPA
          if [[ "$VERSION" == *-* ]]; then PPA="agornostal/ulauncher-dev"; fi
          echo "PPA: $PPA"
          echo -n "$LAUNCHPAD_SSH_TAR" | base64 -d > scripts/launchpad.ssh.tar
          echo -n "$LAUNCHPAD_PUB_KEY" | base64 -d > scripts/launchpad-public.key
          echo -n "$LAUNCHPAD_SECRET_KEY" | base64 -d > scripts/launchpad-secret.key
          tar -xvf scripts/launchpad.ssh.tar -C /
          gpg --import "scripts/launchpad-public.key"
          gpg --import "scripts/launchpad-secret.key"
          # Ubuntu's own release table. The eol column is the end of standard support,
          # so LTS releases in ESM, which Launchpad still lists as supported, are excluded.
          # Newest first, so the likely most used releases are uploaded before a failure stops the loop.
          DISTROS=$(curl -fsS https://salsa.debian.org/debian/distro-info-data/-/raw/main/ubuntu.csv \
            | awk -F, -v today="$(date -u +%F)" 'NR > 1 && $5 <= today && today < $6 { print $3 }' \
            | tac)
          if [ -z "$DISTROS" ]; then echo "Found no supported Ubuntu releases"; exit 1; fi
          echo "Ubuntu releases:" $DISTROS
          for DISTRO in $DISTROS; do
            DEB_VERSION="$(echo $VERSION | tr "-" "~")-0ubuntu1ppa1~${DISTRO}"
            # Launchpad never accepts a version twice, even after it's superseded or removed,
            # and this query returns uploads in any of those states.
            UPLOADS=$(curl -fsS "https://api.launchpad.net/devel/~${PPA%/*}/+archive/ubuntu/${PPA#*/}?ws.op=getPublishedSources&source_name=ulauncher&exact_match=true&version=${DEB_VERSION}&ws.show=total_size")
            if [ "$UPLOADS" != 0 ]; then echo "Skipping ${DEB_VERSION}, already uploaded"; continue; fi
            make deb DEB_VERSION="${DEB_VERSION}" DEB_DISTRO="${DISTRO}" DPKG_ARGS="--post-clean --build=source -sa --sign-key=${GPGKEY}"
            echo "Uploading to launchpad PPA:${PPA}"
            dput -f "ppa:${PPA}" dist/*.changes
            rm dist/*
          done;

      - name: Publish to AUR
        if: "${{ github.event_name == 'release' && !contains(github.ref_name, '-') }}"
        uses: friday/aur-publish-action@master
        with:
          new_release: ${{ github.ref_name }}
          package_name: ulauncher
          commit_username: "Ulauncher"
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_PRIVATE_KEY }}
