name: Tests

on:
  pull_request:
    branches:
      - v5
      - v6
  push:
    branches:
      - '*'
    tags:
      - '*'

jobs:
  tests:
    runs-on: ubuntu-latest
    # The build image ships the python that the v5 packages are built against, but its glibc is too old to run the
    # node the actions need, so the job runs on the host and only puts the build steps in the container.
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Tests
        run: make check-container
      - name: Build docs
        run: make in-container TARGETS=docs
      - name: Build preferences
        run: make in-container TARGETS="prefs SKIP_IF_BUILT=1"
