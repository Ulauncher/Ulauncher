[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ulauncher"
description = "Application launcher for Linux"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Aleksandr Gornostal"},
  {name = "Albin Larsson"},
  {name = "Troy Curtis"},
]
urls.Homepage = "http://ulauncher.io/"
urls.Documentation = "https://docs.ulauncher.io/"
urls.Repository = "https://github.com/Ulauncher/Ulauncher.git"
urls.Issues = "https://github.com/Ulauncher/Ulauncher/issues"
keywords = [ "linux", "desktop", "application", "launcher", "gtk" ]
dependencies = [ "PyGObject", "pycairo", "python-xlib" ]
dynamic = ["version", "license"]

[tool.setuptools.dynamic]
version = {attr = "ulauncher._version.version"}

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
python-platform = "linux"
python-version = "3.8"
project-includes = ["ulauncher", "tests"]
min-severity = "info"
preset = "strict"

[tool.pyrefly.errors]
bad-param-name-override = false
missing-override-decorator = false
implicit-any-lambda = false

# Pylint is not checked in CI or included in `make check` due to being slow.
# Run occasional manual audit with `make pylint`
[tool.pylint."MESSAGES CONTROL"]
disable = "all"
# Enables and documents that gap where the other linters cannot yet detect any real runtime error.
enable = [
  "access-member-before-definition",  # E0203: reads self.x on a path that runs before it is assigned
  "arguments-out-of-order",           # W1114: args passed in the wrong order, invisible when types match
  "assignment-from-no-return",        # E1111: assigns the result of a function that returns nothing
  "bad-except-order",                 # E0701: a broad except before a narrow one leaves the narrow one dead
  "comparison-with-callable",         # W0143: compares a method directly with a value, instead of calling it
  "logging-format-truncated",         # E1201: format string ends mid specifier, so the record is dropped
  "logging-unsupported-format",       # E1200: invalid conversion character, so the record is dropped
  "no-method-argument",               # E0211: method declared without self
  "super-init-not-called",            # W0231: base __init__ never runs, so its attributes are missing
  "unbalanced-dict-unpacking",        # W0644: unpacks a dict into the wrong number of names
  "undefined-loop-variable",          # W0631: uses a loop variable after the loop, unbound if it never ran
]

[tool.typos.default]
extend-ignore-re = [
  # prevent correcting gir to git
  "gir1.2",
]

[tool.typos.files]
extend-exclude = ["preferences-src/static"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
pylint = { max-args = 10}
flake8-pytest-style = {fixture-parentheses = false}
# Only the preview rules named explicitly in `select` are enabled, not every preview rule
# belonging to a selected rule-set.
preview = true
explicit-preview-rules = true
ignore = [
  "ANN401",   # Using Any as an argument type annotation
  "PERF203",  # Useless rule. Python 3.11 introduced "zero-cost" exception handling and there is no alternative if you want to continue iterating yet ignore errors.
  "PLC0415",  # Allow imports outside of top-level for performance reasons
  "RUF012",   # BaseDataClass deep-copies its class-level defaults into every instance, so they aren't shared state
  "S603","S606","S607", # Subprocess rules that only apply with untrusted input.
  "TC001", "TC002", "TC003", # Performance best practice that does nothing for our use
  "TD002", "TD003" # Allow TODOs and FIXMEs without author and link
]
# List is excluding rule-sets for libraries we don't use (like Airflow, FastAPI, NumPy, Pandas etc).
# All other rules should be either included or commented out with a reason for the exclusion.
# See https://docs.astral.sh/ruff/rules/ (synced with ruff 0.14.0)
select = [
  "A",        # flake8-builtins
  "ANN",      # flake8-annotations (ANN2** are not covered by pyrefly)
  "ARG",      # flake8-unused-arguments
  "ASYNC",    # flake8-async
  "B",        # flake8-bugbear
  "B909",     # Mutating a collection while iterating it (preview) ^
  "BLE",      # flake8-blind-except
  "C4",       # flake8-comprehensions
  # "C90",    # mccabe complexity (we already have PLR0911-PLR0915, and mccabe works poorly with our GLib callback style)
  # "COM",    # flake8-commas (we use ruff format instead)
  # "CPY",    # flake8-copyright (enforces copyright headers in python files)
  "DTZ",      # flake8-datetimez
  # "D",      # pydocstyle (validates, formats and enforces docstrings)
  # "DOC",    # pydoclint (enabling this will show a warning because all the rules require preview)
  "E",        # pycodestyle errors
  "EM",       # flake8-errmsg
  "ERA",      # eradicate (commented-out-code)
  "EXE",      # flake8-executable
  "F",        # pyflakes
  "FA",       # flake8-future-annotations
  # "FBT",    # flake8-boolean-trap (opinionated and annoying)
  # "FIX",    # flake8-fixme (forbids fixme comments)
  "FLY",      # flynt
  "FURB",     # refurb
  "G",        # flake8-logging-format
  "I",        # isort
  "ICN",      # flake8-import-conventions
  "INP",      # flake8-no-pep420 (ban implicit namespace packages without __init__.py)
  "INT",      # flake8-gettext
  "ISC",      # flake8-implicit-str-concat
  "LOG",      # flake8-logging
  "N",        # pep8-naming
  "PERF",     # perflint
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint (same as PLC+PLE+PLR+PLW)
  "PLE1141",  # Unpacking a dict in iteration without .items() (preview) ^
  "PT",       # flake8-pytest-style
  # "PTH",    # flake8-use-pathlib (pathlib isn't better for simple use cases)
  "PTH210",   # Only non-opinionated and helpful exception to this rule ^
  "PYI",      # flake8-pyi
  "RET",      # flake8-return
  "RSE",      # flake8-raise
  "RUF",      # ruff-specific rules
  "S",        # flake8-bandit (web server focused, with a small set of rules that are useful for Ulauncher, like exception handling)
  "SLF",      # flake8-self
  "SLOT",     # flake8-slots
  "SIM",      # flake8-simplify
  "T10",      # flake8-debugger
  "T20",      # flake8-print
  "TC",       # flake8-type-checking
  "TD",       # flake8-todos
  "TID",      # flake8-tidy-imports
  "TRY",      # tryceratops
  "UP",       # pyupgrade
  "W",        # pycodestyle warnings
  "Q",        # flake8-quotes
  "YTT",      # flake8-2020
]

[tool.ruff.lint.flake8-tidy-imports]
# typing_extensions is a type-check-only dependency; keep it out of the runtime
banned-module-level-imports = ["typing_extensions"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio" = {msg = "To handle async operations, use Gio or Glib async methods that run in the background. See ulauncher.utils.subprocess_utils."}
"gi.repository" = {msg = "Import GI modules from ulauncher.gi, not gi.repository directly."}
"ulauncher.ui" = {msg = "Import ulauncher.ui only from ulauncher/cli/commands/start.py - it pulls in GTK and must not leak into extension or CLI runtime."}
"ulauncher.api" = {msg = "ulauncher.api is the extension process API. Importing it into the app runs its module-level setup there. Shared types belong in ulauncher.internals."}
"functools.lru_cache" = {msg = "Use ulauncher.utils.lru_cache instead to preserve parameter types."}
"functools.cache" = {msg = "Use ulauncher.utils.lru_cache instead to preserve parameter types."}
"functools.cached_property" = {msg = "cached_property erases property types. If you need to use this, create a typed wrapper similar to ulauncher.utils.lru_cache"}
"threading" = {msg = "Avoid threading. Use callbacks with Glib async methods that run in the background when possible"}

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [  # Relax some linting rules for tests
  "PLR2004",    # Allow direct comparison with integers (magic-value)
  "SLF001",     # Allow accessing private members (obj._hello)
  "S101",       # Allow asserts in tests
  "S108",       # /tmp paths in tests are opaque strings for assertions, not files we write
  "T201",       # Allow print statements
]
"ulauncher/gi.py" = ["TID251"]           # This IS the canonical gi import module
"ulauncher/utils/lru_cache.py" = ["TID251"]  # This IS the lru_cache wrapper
"tests/ui/**/*.py" = ["TID251"]          # UI tests need to import from ulauncher.ui
"tests/api/**/*.py" = ["TID251"]         # API tests need to import from ulauncher.api

[tool.pytest.ini_options]
log_cli = true
filterwarnings = [
  # PyGObject uses deprecated asyncio APIs (AbstractEventLoopPolicy, get_event_loop_policy)
  # slated for removal in Python 3.16. Not fixable from our side; filter until upstream fixes it.
  "ignore::DeprecationWarning:gi",
]

[tool.rumdl]
respect-gitignore = true
exclude = [".git"] # rumdl will check .git/refs/ otherwise
disable = [
  "MD013",  # Line length
  "MD033",  # Allow HTML in markdown (useful for docs)
  "MD040",  # Allow code blocks without language specified
  "MD041",  # Allow first line not to be the heading (because GitHub readme.md badges)
  "MD059",  # Allow non-descriptive link texts (also because of GitHub readme.md badges)
]
MD048 = {style = "backtick"}  # Use ``` only, no ~~~
